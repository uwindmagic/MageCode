[package]
name = "agent-tasks-desktop"
version = "0.2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
magecode-local-source = { path = "../../../crates/local-source" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "MageCode"
path = "src/main.rs"
